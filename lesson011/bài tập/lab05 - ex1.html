<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS nang cao lab04 - ex1</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .product {
            position: relative;                   
            width: 250px;                         
            margin: 100px auto;                   
            padding: 20px 15px;                   
            border: 3px solid #ff9800;          
            border-radius: 12px;                  
            text-align: center;               
            background: #f8f5f0;    
            overflow: hidden;                     
            box-sizing: border-box;               
        }

        .check {
            position: absolute;                   
            top: 0;                               
            right: 0;                             
            width: 0;                             
            height: 0;
            border-top: 40px solid #ff9800;
            border-left: 40px solid transparent;     
        }

        .check::after {
            content: "✓";                    
            position: absolute;               
            top: -38px;                       
            right: 3px;
            color: white;
            font-size: 18px;
            font-weight: bold;                
            transform-origin: center;         
        }

        .product h3 {
            margin: 0;                        
            font-size: 18px;
            font-weight: normal;              
            color: #555;
            line-height: 1.3;                 
        }

        .product p {
            margin: 12px 0 0 0;               
            font-size: 22px;
            font-weight: bold;
            color: #000;
        }

        .product:hover .check::after {
            animation: lac 0.6s ease-in-out infinite;
        }

        @keyframes lac {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-20deg);
            }

            50% {
                transform: rotate(20deg);
            }

            75% {
                transform: rotate(-20deg);
            }

            100% {
                transform: rotate(0deg);
            }

        }
    </style>

</head>

<body>
    <div class="product">
        <div class="check">✓</div>

        <h3>Macbook Air M4 | core GPU + 512GB</h3>
        <p>28.790.000 VND</p>
    </div>
</body>

</html>
