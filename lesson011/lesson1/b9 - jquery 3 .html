<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery selector</title>
</head>

<body>

    <div id="zone1">
        <h1>Jquery selector</h1>
        <hr>
    </div>

    <div id="zone2">
        <button class="btn">Click vào đây</button>
    </div>

    <div id="zone3">
        <p>This is zone 3</p>

        <div>
            <p class="noi-dung">
                Nội dung của div zone 3
            </p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

    <script>
        $(document).ready(function () {
            // alert("running.....");

            // Tương tác thông qua ID
            $("#zone1").css("background-color", "yellow");

            $("#zone1").click(function () {
                $(this).html("<h1>Bạn vừa click vào div có id là zone1</h1>");
            });


            // Tương tác thông qua phần tử HTML
            $("h1").css("color", "red");

            $("button").click(function () {
                $(this).html("<h1>Bạn vừa click vào button</h1>");
            });


            // Tương tác thông qua class
            $(".btn").hover(function () {
                $(".btn").css({
                    "background-color": "blue",
                    "color": "white",
                    "width": "200px",
                    "height": "50px",
                    "cursor": "pointer"
                });
            });


            $(".btn").mouseleave(function () {
                $(".btn").css("background-color", "black");
            });


            // CSS selector
            $("div p").css("font-size", "3rem");

            $("#zone3 > p").css("color", "green");

        });
    </script>

</body>

</html>
