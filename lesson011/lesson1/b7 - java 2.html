<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        <!-- khai báo biến-->
        var name = "Devmaster"
        document.write("Hello " + name)
        console.log("Hello " + name)

        <!-- đưa ra thông báo -->
        alert("Hello " + name);

        <!-- hàm confirm -->
        var isConfirm = confirm("Bạn có muốn tiếp tục không?");
        document.write("<p>Is Confirm: " + isConfirm + "<p>");
        console.log(isConfirm);
        
        <!-- hàm prompt-->
        var age = prompt("Bạn bao nhiêu tuổi?");
        document.write("<p>Age: " + age + "<p>");
        console.log(age);
    </script>
</body>
</html>
