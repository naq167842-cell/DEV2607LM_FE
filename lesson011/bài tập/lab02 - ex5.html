<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch học</title>
    
</head>

<body>
    <table border="1px" width="100%" cellspacing="0" cellpadding="5px">
        <thead>
            <tr>
                <th rowspan="3"><b>Buổi</b></th>
                <th colspan="3"><b>Lịch học</b></th>
            </tr>

            <tr bgcolor="#ccc">
                <th colspan="2">Thời gian</th>
                <th rowspan="2">Môn học</th>
            </tr>

            <tr>
                <th>Bắt đầu</th>
                <th>Kết thúc</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center" bgcolor="#ccc">
                <th rowspan="2"><b>Thứ 2</b></th>
                <td rowspan="2">8:00 AM</td>
                <td rowspan="2">12:00 AM</td>
                <td>Cơ sở dữ lệu</td>
            </tr>

            <tr align="center">
                <td>Nhập môn C</td>
            </tr>

            <tr align="center" bgcolor="#ccc">
                <th rowspan="3"><b>Thứ 3</b></th>
                <td>8:00 AM</td>
                <td>12:00 AM</td>
                <td rowspan="3">
                    Thiết kế Web
                    <hr/>
                    PHP
                </td>
            </tr>

            <tr align="center">
                <td>2:00 PM</td>
                <td>5:00 PM</td>
            </tr>

            <tr align="center" bgcolor="#ccc">
                <td>6:00 PM</td>
                <td>8:00 PM</td>
            </tr>
            
            <tr align="center">
                <td><b>Thứ 4</b></td>
                <td>2:00 AM</td>
                <td>9:00 PM</td>
                <td>JAVA CORE</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
