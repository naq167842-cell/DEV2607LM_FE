<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS nang cao lab04 - ex2</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .product {
            position: relative;
            width: 270px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-sizing: border-box;
            background: url(https://taca.com.vn/wp-content/uploads/2022/05/1-1.jpg) center/cover no-repeat;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: .4s;
            background: rgba(0, 0, 0, .4);
            z-index: 1;
        }

        .product:hover .overlay {
            background: rgba(34, 139, 34, .7);
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: white;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .circle {
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle img {
            width: 80%;
            height: auto;
        }

        .content p {
            font-size: 14px;
            margin: 0 0 8px 0;
        }

        .content h4 {
            font-size: 15px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .content a {
            display: inline-block;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 22px;
            transition: .3s;
        }

        .content a:hover {
            background: white;
            color: #228b22;
        }
    </style>
</head>

<body>
    <div class="product">
        <div class="overlay"></div>
        <div class="content">
            <div class="circle">
                <img src="https://png.pngtree.com/png-clipart/20220110/original/pngtree-two-man-talk-interview-illustration-png-vector-png-image_7056738.png"
                    alt="avatar">
            </div>
            <p>DỊCH VỤ</p>
            <h4>TƯ VẤN XUẤT KHẨU LAO ĐỘNG</h4>
            <a href="#">CHI TIẾT</a>
        </div>
    </div>
</body>

</html>
